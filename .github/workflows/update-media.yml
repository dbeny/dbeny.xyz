name: Update Ragebait Gif List

on:
    push:
        paths:
            - "media/**"

permissions:
    contents: write

jobs:
    update:
        name: Update Media List
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Generate files.json
              run: |
                  cd media
                  find . -maxdepth 1 -type f \( -name "*.gif" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) -printf '"%P",\n' | sed '$ s/,$//' | awk 'BEGIN {print "["} {print} END {print "]"}' > files.json

            - name: Commit and push if changed
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add media/files.json
                  git diff --staged --quiet || git commit -m "Auto-update media/files.json"
                  git push
